<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · CampusLoop</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="auth"><main class="auth-card"><a class="brand" href="/">◈ CampusLoop</a><p class="eyebrow">JOIN YOUR CAMPUS</p><h1>Let's get started.</h1><p class="muted">Create your student account to report and recover items.</p><div class="alert" th:if="${error}" th:text="${error}"></div><form method="post" th:action="@{/register}"><label>Full name<input name="name" maxlength="80" required></label><label>College email<input name="email" type="email" required></label><label>Student number <span class="optional">optional</span><input name="studentNumber" maxlength="30"></label><label>Password<input name="password" type="password" minlength="8" required><small>At least 8 characters</small></label><button class="btn primary wide">Create account <span>→</span></button></form><p class="muted center">Already registered? <a th:href="@{/login}">Sign in</a></p></main><script th:src="@{/js/app.js}"></script></body></html>
