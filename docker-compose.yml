services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: campus_lost_found
      MYSQL_ROOT_PASSWORD: campusroot
    ports: ["3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pcampusroot"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/campus_lost_found?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: campusroot
      PORT: 8085
    ports: ["8085:8085"]
volumes:
  mysql-data:
