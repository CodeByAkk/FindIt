<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · CampusLoop</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="auth"><main class="auth-card"><a class="brand" href="/">◈ CampusLoop</a><p class="eyebrow">CAMPUS LOST & FOUND</p><h1>Good to see you.</h1><p class="muted">Sign in to reconnect with your belongings.</p><div class="alert" th:if="${param.error}">Email or password is incorrect.</div><div class="alert success" th:if="${success}" th:text="${success}"></div><div class="alert success" th:if="${param.logout}">You have signed out.</div><form method="post" th:action="@{/login}"><label>College email<input name="username" type="email" placeholder="you@campus.edu" required autofocus></label><label>Password<input name="password" type="password" placeholder="Your password" required></label><button class="btn primary wide">Sign in <span>→</span></button></form><p class="muted center">New to CampusLoop? <a th:href="@{/register}">Create an account</a></p><div class="demo">Demo student: student@campus.edu / Student@123<br>Admin: admin@campus.edu / Admin@123</div></main><script th:src="@{/js/app.js}"></script></body></html>
