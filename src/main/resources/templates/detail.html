<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${item.name+' · CampusLoop'}">Item</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main class="detail-page"><a class="text-link" href="/dashboard">← Back to dashboard</a><div class="alert success" th:if="${success}" th:text="${success}"></div><div class="alert" th:if="${error}" th:text="${error}"></div><section class="detail-card"><div class="detail-photo"><img th:if="${item.imagePath}" th:src="${item.imagePath}" alt="Item"><span th:unless="${item.imagePath}" class="item-placeholder">✦</span></div><div class="detail-copy"><span class="badge" th:classappend="${item.type=='LOST'?' lost':' found'}" th:text="${item.type}">LOST</span><span class="category" th:text="${item.category}">Category</span><h1 th:text="${item.name}">Item</h1><p th:text="${item.description?:'No additional description provided.'}">Description</p><div class="detail-facts"><span>⌖ <b th:text="${item.location}">Location</b></span><span>◷ <b th:text="${item.itemDate}">Date</b></span><span>Reported by <b th:text="${item.reporter.name}">User</b></span></div><div class="match-note" th:if="${!matches.isEmpty()}"><b>Possible matches</b><p th:each="match:${matches}" th:text="${match.score+'% match · '+match.item.name+' at '+match.item.location}">Match</p></div><form th:if="${item.reporter.id != user.id and item.status.name()=='APPROVED'}" method="post" th:action="@{/items/{id}/claims(id=${item.id})}" class="claim-form"><label>Think this is yours? Tell us how you can identify it.<textarea name="proof" rows="3" maxlength="1500" required placeholder="Describe a unique detail that only the owner would know…"></textarea></label><button class="btn primary">Submit a claim →</button></form></div></section></main><script th:src="@{/js/app.js}"></script></body></html>
