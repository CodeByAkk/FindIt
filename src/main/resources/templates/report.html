<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Report an item · CampusLoop</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <a class="brand" href="/dashboard">◈ CampusLoop</a>
        <div class="side-label">WORKSPACE</div>
        <a class="nav" href="/dashboard">⌂ <span>Overview</span></a>
        <a class="nav active" href="/items/new">＋ <span>Report an item</span></a>
        <div class="side-bottom">
            <a class="nav" href="/dashboard">← <span>Back to dashboard</span></a>
        </div>
    </aside>

    <main class="main narrow">
        <header class="topbar">
            <div>
                <p class="eyebrow">COMMUNITY CONTRIBUTION</p>
                <h1>Report an item</h1>
                <p class="muted">A few details can help something find its way home.</p>
            </div>
        </header>

        <div class="alert" th:if="${error}" th:text="${error}"></div>

        <form class="panel form-panel" method="post" th:action="@{/items( _csrf=${_csrf.token} )}" enctype="multipart/form-data">
            <div class="type-select">
                <label>
                    <input type="radio" name="type" value="LOST" checked>
                    <span>⌕ <b>I lost something</b><small>Help someone return it to you</small></span>
                </label>
                <label>
                    <input type="radio" name="type" value="FOUND">
                    <span>✦ <b>I found something</b><small>Help it get back to its owner</small></span>
                </label>
            </div>
            <div class="form-grid">
                <label>Item name
                    <input name="name" placeholder="e.g. Blue Hydro Flask" maxlength="100" required>
                </label>
                <label>Category
                    <select name="category" required>
                        <option value="">Choose category</option>
                        <option th:each="c:${categories}" th:text="${c}" th:value="${c}">Other</option>
                    </select>
                </label>
                <label>Where was it lost / found?
                    <input name="location" placeholder="e.g. Main library, floor 2" required>
                </label>
                <label>Date
                    <input type="date" name="itemDate" th:value="${T(java.time.LocalDate).now()}" required>
                </label>
                <label class="full">Description
                    <textarea name="description" rows="4" maxlength="1000" placeholder="Color, brand, unique markings, or other helpful details…"></textarea>
                </label>
                <label class="full">Photo <span class="optional">optional · JPG, PNG · max 5 MB</span>
                    <input type="file" name="image" accept="image/*">
                </label>
            </div>
            <div class="form-actions">
                <a class="btn secondary" href="/dashboard">Cancel</a>
                <button class="btn primary">Submit for review →</button>
            </div>
            <p class="fine-print">Reports are reviewed by campus staff before appearing publicly.</p>
        </form>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
